[package]
name = "blendfarm"
"authors" = ["Jordan Bejar"]
description = "A Network Render Farm Manager and Service"
license = "MIT"
repository = "https://github.com/tiberiumboy/BlendFarm"
edition = "2024"
version = "0.1.3"

[lib]
name = "blenderfarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
debug = "full"
# debug = "line-tables-only"
incremental = true
lto = "thin"

[profile.release]
lto = true
strip = true
opt-level = "s"
panic = "abort"
codegen-units = 1
incremental = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"
async-trait = "0.1"
async-std = "1.13"
blender_rs = { git = "https://github.com/tiberiumboy/blender_rs.git" }
# postcard = "1.1.3" # Not in used? https://crates.io/crates/postcard
futures = "0.3"
semver = "1.0"
machine-info = "1"    # Use to extract system information
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["rt", "net", "test-util", "macros", "signal"] }
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-native-tls",
    "sqlite",
    "uuid",
    "json",
] }
dotenvy = "0"
# TODO: Compile restriction: Test and deploy using stable version of Rust! Recommends development on Nightly releases
maud = "0.27" # Used to render HTML page server-side
urlencoding = "2.1"
async-lock = "3.4"
iroh = "1.0"
iroh-blobs = "0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1.3", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "serde",
] }
n0-future = "0.3"
rand = "0"
irpc = "0.17"

# this came autogenerated. Maybe possible future implementation/features.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }

[dev-dependencies]
ntest = "*"

# [build]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]
