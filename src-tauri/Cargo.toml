[package]
name = "blendfarm"
"authors" = ["Jordan Bejar"]
description = "A Network Render Farm Manager and Service"
license = "MIT"
repository = "https://github.com/tiberiumboy/BlendFarm"
edition = "2024"
version = "0.1.2"

[lib]
name = "blenderfarm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
debug = 1
incremental = true
lto = "thin"

[profile.release]
lto = true
strip = true
opt-level = "s"
panic = "abort"
codegen-units = 1
incremental = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libp2p = { version = "0.56", features = [
    "mdns",
    "macros",
    "gossipsub",
    "noise",
    "ping",
    "tcp",
    "tokio",
    "yamux",
    "tls",
    "quic",
    "kad",
] }
anyhow = "1.0"
dirs = "6.0"
async-trait = "0.1"
async-std = "1.13"
blend = "0.8"
blender = { git = "https://github.com/tiberiumboy/blender_rs.git" }
postcard = "1.1.3"
dunce = "1.0"
libp2p-request-response = { version = "0", features = ["cbor"] }
futures = "0.3"
semver = "1.0"
# Use to extract system information
machine-info = "1.0"
thiserror = "2.0"
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-os = "2.2"
tauri-plugin-persisted-scope = "2.2"
tauri-plugin-shell = "2.2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-native-tls",
    "sqlite",
    "uuid",
    "json",
] }
dotenvy = "0.15"
# TODO: Compile restriction: Test and deploy using stable version of Rust! Recommends development on Nightly releases
maud = "0.27"
urlencoding = "2.1"
bitflags = "2"
async-lock = "3.4"

# this came autogenerated. I don't think I will develop this in the future, but would consider this as an april fools joke. Yes I totally would.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2.2"
tauri = { version = "2.6", features = ["protocol-asset", "tray-icon", "test"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
uuid = { version = "1.3", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "serde",
] }

[dev-dependencies]
ntest = "*"

