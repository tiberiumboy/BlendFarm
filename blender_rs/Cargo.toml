[package]
name = "blender"
version = "0.1.0"
edition = "2021"

# TODO: Make this crate a library instead of binary
# [lib]
# crate-type = ["cdylib"]

[dependencies]
dirs = "6.0.0"
lazy-regex = "3.6"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
attohttpc = { version = "0.31", features = ["json"] }
blend = "0.8.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[dev-dependencies]
clap = { version = "4.6.0", features = ["derive"] }

# Platform dependent crates used for unzip and extract contents for Blender
[target.'cfg(target_os = "windows")'.dependencies]
zip = "8.1"

[target.'cfg(target_os = "macos")'.dependencies]
dmg = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dependencies]
xz = { version = "0.1" }
tar = { version = "0.4" }
