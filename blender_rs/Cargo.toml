[package]
name = "blender"
version = "0.1.0"
edition = "2021"

# trying something out, make this library once I can understand how I can reference this externally from tauri side of application
# [lib]
# crate-type = ["cdylib"]

[dependencies]
dirs = "6.0.0"
regex = "^1.11.1"
lazy-regex = "^3.6"
semver = { version = "^1.0", features = ["serde"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
url = { version = "^2.5.4", features = ["serde"] }
thiserror = "^2.0"
uuid = { version = "^1.21", features = ["serde", "v4"] }
ureq = { version = "^3.0" }
blend = "0.8.0"
tokio = { version = "^1.49", features = ["full"] }
# xml-rpc will merge into this project some day in the future, as it's just a http server protocol.
# xml-rpc = { git = "https://github.com/tiberiumboy/xml-rpc-rs.git", branch = "main" }
# xml-rpc = { path = "/home/oem/Documents/src/rust/xml-rpc-rs" }
# TODO: Clap is only ever used in examples. Do not include clap for release mode build. Add a feature switch to include examples.
clap = { version = "4.6.0", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
zip = "^8.1"

[target.'cfg(target_os = "macos")'.dependencies]
dmg = { version = "^0.1" }

[target.'cfg(target_os = "linux")'.dependencies]
xz = { version = "^0.1" }
tar = { version = "^0.4" }
